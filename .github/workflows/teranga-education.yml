name: TERANGA ÉDUCATION — tests

on:
  push:
    paths: ['teranga-education/**', '.github/workflows/teranga-education.yml']
  pull_request:
    paths: ['teranga-education/**', '.github/workflows/teranga-education.yml']

jobs:
  base-de-donnees:
    name: Base de données (schéma + droits d'accès)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: ./teranga-education/supabase/tests/run_tests.sh | tee resultat.txt
      - run: grep -q "TOUS LES TESTS SONT PASSÉS" resultat.txt

  application:
    name: Application (types, tests unitaires, compilation)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: teranga-education/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: teranga-education/app/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: VITE_SUPABASE_ANON_KEY=ci-placeholder npx vite build

  fonctions-serveur:
    name: Fonctions serveur (vérification des types Deno)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: teranga-education/supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno check serve-local.ts admin-users/index.ts assistant-ia/index.ts
