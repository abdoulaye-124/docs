name: TERANGA ÉDUCATION — déploiement Supabase

# Lancé À LA MAIN (onglet Actions › « Run workflow ») : jamais automatiquement.
# Secrets à créer dans GitHub (Settings › Secrets and variables › Actions) :
#   SUPABASE_ACCESS_TOKEN  jeton personnel Supabase (Account › Access Tokens)
#   SUPABASE_PROJECT_REF   identifiant du projet (Settings › General)
#   SUPABASE_DB_PASSWORD   mot de passe de la base choisi à la création du projet
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Tapez DEPLOYER pour appliquer les migrations et les fonctions en production'
        required: true

jobs:
  deployer:
    if: github.event.inputs.confirmation == 'DEPLOYER'
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJET: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Lier le projet
        run: supabase link --project-ref "$PROJET" --password "$SUPABASE_DB_PASSWORD" --workdir teranga-education
      - name: Migrations de la base (schéma, règles d'accès)
        run: yes | supabase db push --password "$SUPABASE_DB_PASSWORD" --workdir teranga-education
      - name: Fonctions serveur
        run: supabase functions deploy admin-users assistant-ia --project-ref "$PROJET" --workdir teranga-education
      - name: Assistant IA désactivé (aucun frais) tant qu'aucune clé n'est fournie
        run: supabase secrets set TERANGA_IA_FOURNISSEUR=aucun --project-ref "$PROJET" --workdir teranga-education
